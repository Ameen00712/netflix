<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <header>
        <a class="logoLink" href="#" aria-label="Netflix Home">
            <img class="netflixLogo" src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="NETFLIX">
        </a>
        <nav>
            <a href="#">Home</a>
            <a href="#">TV Shows</a>
            <a href="#">Movies</a>
            <a href="#">New & Popular</a>
            <a href="#">My List</a>
        </nav>
        <div class="searchBox">
            <input type="text" id="search" placeholder="Search Movies...">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
    </header>

    <section class="banner">
        <div class="overlayBanner">
            <h1>Unlimited Movies, TV Shows & More</h1>
            <p>Watch anywhere. Cancel anytime.</p>
            <div class="buttons">
                <button class="playBtn"><i class="fa-solid fa-play"></i> Play</button>
                <button class="infoBtn"><i class="fa-solid fa-circle-info"></i> More Info</button>
            </div>
        </div>
    </section>

    <section class="movies">
        <h2>Trending Movies</h2>
        <div id="movieRow" class="movieRow"></div>
    </section>

    <footer><p>Netflix Clone © 2026</p></footer>
    <script src="script.js?v=20260903"></script>
</body>
</html>
